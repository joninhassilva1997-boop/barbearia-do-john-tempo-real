<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a"><meta name="description" content="Gestão da Barbearia do John">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>John • Gestão</title>
<style>
:root{--bg:#070707;--card:#111;--line:#292929;--text:#f5f1e8;--muted:#aaa;--gold:#d1aa62;--green:#5dd39e;--red:#ef6b73;--blue:#72a7ff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#090909,#050505);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:92px}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand{font-weight:900;font-size:22px}.muted{color:var(--muted)}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:var(--gold);color:#111}.ghost{background:#181818;color:var(--text);border:1px solid var(--line)}.danger{background:#3a1719;color:#ffb4b9}.login,.panel{max-width:680px;margin:70px auto}.card{background:rgba(17,17,17,.96);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 12px 35px #0005}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:16px;border:1px solid var(--line);border-radius:16px;background:#0d0d0d}.metric b{display:block;font-size:23px;margin-top:6px}.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tab{white-space:nowrap}.tab.active{background:var(--gold);color:#111}.booking{border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0;background:#0d0d0d}.booking-head{display:flex;justify-content:space-between;gap:10px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;background:#222}.pending{color:#ffd98d}.confirmed{color:#8fc1ff}.completed{color:#82e5b3}.cancelled{color:#ff9ba2}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px;margin:9px 0}.field input,.field select{background:#080808;color:#fff;border:1px solid var(--line);padding:12px;border-radius:10px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b0b0bf2;border-top:1px solid var(--line);backdrop-filter:blur(12px);padding:10px;display:flex;justify-content:center;z-index:10}.bottom .actions{max-width:1100px;width:100%}.empty{text-align:center;padding:30px;color:var(--muted)}.notice{padding:11px 13px;border-radius:12px;background:#17130b;border:1px solid #4a3a1e;color:#f2d79c;margin:10px 0}.hidden{display:none!important}.modal-backdrop{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px;z-index:30}.modal{width:min(520px,100%);background:#111;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 20px 60px #000}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.summary div{background:#0b0b0b;border:1px solid var(--line);border-radius:14px;padding:12px}.summary b{display:block;margin-top:4px;font-size:18px}.success{color:var(--green)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.wrap{padding:12px}.row{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.metric{padding:12px}.metric b{font-size:19px}.top{align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <div id="loginView" class="login"><div class="card"><div class="brand">✂️ Barbearia do John</div><p class="muted">Gestão da barbearia</p><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password"></div><button class="primary" id="loginBtn">Entrar</button><p id="loginMsg" class="muted"></p></div></div>
  <div id="appView" class="hidden">
    <header class="top"><div><div class="brand">✂️ Barbearia do John</div><div id="todayLabel" class="muted"></div></div><div class="actions"><button class="ghost" id="notifyBtn">🔔 Ativar notificações</button><button class="ghost" id="logoutBtn">Sair</button></div></header>
    <div id="notice" class="notice hidden"></div>
    <section class="grid"><div class="metric"><span class="muted">Atendimentos</span><b id="mCount">0</b></div><div class="metric"><span class="muted">Concluídos</span><b id="mDone">0</b></div><div class="metric"><span class="muted">Faturado</span><b id="mRevenue">R$ 0,00</b></div><div class="metric"><span class="muted">Próximo</span><b id="mNext">—</b></div></section>
    <div class="tabs"><button class="tab active" data-filter="today">Hoje</button><button class="tab ghost" data-filter="all">Todos</button><button class="tab ghost" data-filter="pending">Pendentes</button></div>
    <section class="card"><div class="top"><div><h2 style="margin:0">Agenda</h2><div class="muted">Acompanhe os cortes do dia</div></div><button class="ghost" id="refreshBtn">↻ Atualizar</button></div><div id="list"></div></section>
  </div>
</div>
<div class="bottom"><div class="actions"><button class="primary" id="cashBtn">💰 Fechar caixa do dia</button><button class="ghost" id="installBtn" style="display:none">📲 Instalar app</button></div></div>

<div id="finishModal" class="modal-backdrop hidden"><div class="modal"><h2 style="margin-top:0">Concluir atendimento</h2><div id="finishInfo" class="muted"></div><div class="field"><label>Valor recebido</label><input id="finishAmount" type="number" step="0.01" min="0"></div><div class="field"><label>Forma de pagamento</label><select id="finishPayment"><option value="Pix">Pix</option><option value="Dinheiro">Dinheiro</option><option value="Cartão">Cartão</option><option value="Outro">Outro</option></select></div><div class="actions" style="justify-content:flex-end"><button class="ghost" id="finishCancel">Voltar</button><button class="primary" id="finishConfirm">✓ Concluir</button></div></div></div>
<div id="cashModal" class="modal-backdrop hidden"><div class="modal"><h2 style="margin-top:0">💰 Fechamento do caixa</h2><div id="cashDate" class="muted"></div><div class="summary"><div><span class="muted">Atendimentos</span><b id="cashCount">0</b></div><div><span class="muted">Total</span><b id="cashTotal">R$ 0,00</b></div><div><span class="muted">Pix</span><b id="cashPix">R$ 0,00</b></div><div><span class="muted">Dinheiro</span><b id="cashCash">R$ 0,00</b></div><div><span class="muted">Cartão</span><b id="cashCard">R$ 0,00</b></div><div><span class="muted">Ticket médio</span><b id="cashAvg">R$ 0,00</b></div></div><p class="success" id="cashOk"></p><div class="actions" style="justify-content:flex-end"><button class="primary" id="cashClose">Fechar</button></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const cfg=window.SUPABASE_CONFIG||{};let sb=null,currentFilter='today',bookings=[];let finishingId=null;
const prices={'Corte':25,'Barba':10,'Corte + Barba':35,'Luzes':80,'Selagem':60,'Alisamento':50,'Platinado':90,'Acabamento':10,'Consultoria de estilo':0};
const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0));
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA');const time=t=>String(t||'').slice(0,5);
function showNotice(msg){const n=document.querySelector('#notice');n.textContent=msg;n.classList.remove('hidden');setTimeout(()=>n.classList.add('hidden'),5000)}
function init(){if(!cfg.url||!cfg.anonKey||cfg.url.includes('SEU-PROJETO'))throw new Error('Configure o arquivo config.js com a URL e a chave publishable do seu Supabase.');sb=supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}
async function load(){const {data,error}=await sb.from('bookings').select('*').order('booking_date',{ascending:true}).order('start_time',{ascending:true});if(error){showNotice('Erro ao carregar agenda: '+error.message);return}bookings=data||[];render()}
function visible(){if(currentFilter==='today')return bookings.filter(b=>b.booking_date===today());if(currentFilter==='pending')return bookings.filter(b=>b.status==='pending');return bookings}
function labelStatus(s){return s==='pending'?'Pendente':s==='confirmed'?'Confirmado':s==='completed'?'Concluído':'Cancelado'}
function render(){const d=today();document.querySelector('#todayLabel').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});const todays=bookings.filter(b=>b.booking_date===d),done=todays.filter(b=>b.status==='completed'),revenue=done.reduce((s,b)=>s+Number(b.amount??prices[b.service]??0),0),now=new Date(),upcoming=todays.filter(b=>b.status!=='cancelled'&&new Date(b.booking_date+'T'+time(b.start_time))>=now).sort((a,b)=>a.start_time.localeCompare(b.start_time))[0];document.querySelector('#mCount').textContent=todays.filter(b=>b.status!=='cancelled').length;document.querySelector('#mDone').textContent=done.length;document.querySelector('#mRevenue').textContent=money(revenue);document.querySelector('#mNext').textContent=upcoming?time(upcoming.start_time):'—';const list=document.querySelector('#list'),arr=visible();if(!arr.length){list.innerHTML='<div class="empty">Nenhum agendamento encontrado.</div>';return}list.innerHTML=arr.map(b=>{let buttons='';if(b.status==='pending')buttons+=`<button class="primary" onclick="updateStatus('${b.id}','confirmed')">✓ Confirmar</button><button class="danger" onclick="updateStatus('${b.id}','cancelled')">Cancelar</button>`;else if(b.status==='confirmed')buttons+=`<button class="primary" onclick="openFinish('${b.id}')">✓ Concluir</button><button class="danger" onclick="updateStatus('${b.id}','cancelled')">Cancelar</button>`;else if(b.status==='completed')buttons+=`<span class="badge completed">${esc(b.payment_method||'Pagamento não informado')}</span>`;return `<article class="booking"><div class="booking-head"><div><strong>${time(b.start_time)} · ${esc(b.customer_name)}</strong><div class="muted">${esc(b.service)} · ${money(b.amount??prices[b.service]??0)}</div></div><span class="badge ${b.status}">${labelStatus(b.status)}</span></div><div class="muted" style="margin:8px 0">${b.booking_date} · ${esc(b.phone)}</div><div class="actions">${buttons}</div></article>`}).join('')}
async function updateStatus(id,s){const {data,error}=await sb.from('bookings').update({status:s}).eq('id',id).select('id,status').single();if(error){showNotice('Não foi possível atualizar: '+error.message);return}showNotice(s==='confirmed'?'Agendamento confirmado.':'Agendamento cancelado.');await load()}
function openFinish(id){const b=bookings.find(x=>x.id===id);if(!b)return;finishingId=id;document.querySelector('#finishInfo').textContent=`${b.customer_name} • ${b.service} • horário ${time(b.start_time)}`;document.querySelector('#finishAmount').value=Number(b.amount??prices[b.service]??0);document.querySelector('#finishPayment').value=b.payment_method||'Pix';document.querySelector('#finishModal').classList.remove('hidden')}
function closeFinish(){finishingId=null;document.querySelector('#finishModal').classList.add('hidden')}
async function confirmFinish(){const b=bookings.find(x=>x.id===finishingId);if(!b)return;const amount=Number(document.querySelector('#finishAmount').value||0);const method=document.querySelector('#finishPayment').value;const {error}=await sb.from('bookings').update({status:'completed',payment_method:method,amount,paid_at:new Date().toISOString()}).eq('id',b.id);if(error){showNotice('É necessário executar a migração SQL V2 no Supabase. '+error.message);return}closeFinish();showNotice('Atendimento concluído e pagamento registrado.');await load()}
function openCash(){const box=document.createElement('div');box.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px';box.innerHTML=`<div style="background:#fff;padding:24px;border-radius:16px;width:100%;max-width:360px;text-align:center;color:#111"><div style="font-size:22px;font-weight:bold;margin-bottom:18px">📅 Escolha a data do caixa</div><input id="cashDatePicker" type="date" value="${today()}" style="width:100%;box-sizing:border-box;padding:14px;font-size:18px;border:1px solid #ccc;border-radius:10px;margin-bottom:18px"><div style="display:flex;gap:10px"><button id="cashDateCancel" style="flex:1;padding:12px;border:0;border-radius:10px;background:#ddd;color:#111;font-size:16px">Cancelar</button><button id="cashDateOk" style="flex:1;padding:12px;border:0;border-radius:10px;background:#111;color:#fff;font-size:16px">Continuar</button></div></div>`;document.body.appendChild(box);const input=box.querySelector('#cashDatePicker');box.querySelector('#cashDateCancel').onclick=()=>box.remove();box.querySelector('#cashDateOk').onclick=()=>{const d=input.value;if(!d)return;const done=bookings.filter(b=>b.booking_date===d&&b.status==='completed'),sum=done.reduce((s,b)=>s+Number(b.amount??prices[b.service]??0),0);const by=m=>done.filter(b=>(b.payment_method||'').toLowerCase()===m).reduce((s,b)=>s+Number(b.amount||0),0);const dateObj=new Date(d+'T12:00:00');document.querySelector('#cashDate').textContent=dateObj.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});document.querySelector('#cashCount').textContent=done.length;document.querySelector('#cashTotal').textContent=money(sum);document.querySelector('#cashPix').textContent=money(by('pix'));document.querySelector('#cashCash').textContent=money(by('dinheiro'));document.querySelector('#cashCard').textContent=money(by('cartão'));document.querySelector('#cashAvg').textContent=money(done.length?sum/done.length:0);document.querySelector('#cashOk').textContent=done.length?`Caixa pronto para conferência: ${done.length} atendimento(s).`:`Nenhum atendimento concluído em ${dateObj.toLocaleDateString('pt-BR')}.`;box.remove();document.querySelector('#cashModal').classList.remove('hidden')}}
function closeCash(){document.querySelector('#cashModal').classList.add('hidden')}
async function enableNotifications(){if(!('Notification'in window)){showNotice('Seu navegador não oferece notificações.');return}const p=await Notification.requestPermission();if(p==='granted'){localStorage.setItem('john_notifications','1');showNotice('Notificações ativadas neste aparelho.');document.querySelector('#notifyBtn').textContent='🔔 Notificações ativas'}else showNotice('Permissão de notificação não concedida.')}
let realtimeChannel=null;
function subscribeRealtime(){if(realtimeChannel)return;realtimeChannel=sb.channel('bookings-live').on('postgres_changes',{event:'*',schema:'public',table:'bookings'},payload=>{load();if(payload.eventType==='INSERT'){const b=payload.new;const msg=`Novo agendamento: ${b.customer_name} • ${b.service} • ${time(b.start_time)}`;showNotice('🔔 '+msg);if(Notification.permission==='granted')new Notification('Barbearia do John',{body:msg,icon:'icon.svg'})}}).subscribe()}
async function boot(){try{init();const {data}=await sb.auth.getSession();if(data.session){document.querySelector('#loginView').classList.add('hidden');document.querySelector('#appView').classList.remove('hidden');if(Notification.permission==='granted')document.querySelector('#notifyBtn').textContent='🔔 Notificações ativas';await load();subscribeRealtime()}}catch(e){document.querySelector('#loginMsg').textContent=e.message}}
document.querySelector('#loginBtn').onclick=async()=>{try{init();const {error}=await sb.auth.signInWithPassword({email:document.querySelector('#email').value,password:document.querySelector('#password').value});if(error)document.querySelector('#loginMsg').textContent=error.message;else{document.querySelector('#loginView').classList.add('hidden');document.querySelector('#appView').classList.remove('hidden');await load();subscribeRealtime()}}catch(e){document.querySelector('#loginMsg').textContent=e.message}};
document.querySelector('#logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};document.querySelector('#refreshBtn').onclick=load;document.querySelector('#notifyBtn').onclick=enableNotifications;document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{currentFilter=x.dataset.filter;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===x));render()});document.querySelector('#cashBtn').onclick=openCash;document.querySelector('#cashClose').onclick=closeCash;document.querySelector('#finishCancel').onclick=closeFinish;document.querySelector('#finishConfirm').onclick=confirmFinish;
let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;document.querySelector('#installBtn').style.display='inline-block'});document.querySelector('#installBtn').onclick=async()=>{if(deferred){deferred.prompt();deferred=null}};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');boot();
</script></body></html>
